name: Deploy to Cloud Run Development

env:
  SERVICE_NAME: sample-landscaping-1
  PROJECT_ID: opportune-lore-422100-i5
  REGION: us-central1

on:
  push:
    branches:
    - develop

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Google Cloud Auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/265055974226/locations/global/workloadIdentityPools/github/providers/github
        service_account: nobounce-ci-cd@opportune-lore-422100-i5.iam.gserviceaccount.com

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker gcr.io --quiet

    - name: Build and push image
      run: |
        docker build -t gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .
        docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

    - name: Deploy to Google Cloud Run
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
          --region ${{ env.REGION }} \
          --service-account landscaping-run@opportune-lore-422100-i5.iam.gserviceaccount.com \
          --max-instances 3
